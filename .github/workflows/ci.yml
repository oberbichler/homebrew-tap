name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  style:
    name: brew style & audit
    runs-on: macos-latest
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Check out tap
        uses: actions/checkout@v5
        with:
          path: tap

      - name: Link tap into Homebrew
        run: |
          tap_dir="$(brew --repository)/Library/Taps/oberbichler/homebrew-tap"
          mkdir -p "$(dirname "$tap_dir")"
          ln -s "$GITHUB_WORKSPACE/tap" "$tap_dir"

      - name: Skip if tap has no formulas
        id: formulas
        run: |
          if compgen -G "$GITHUB_WORKSPACE/tap/Formula/*.rb" > /dev/null; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No formulas in Formula/ — nothing to check."
          fi

      - name: brew style
        if: steps.formulas.outputs.found == 'true'
        run: brew style oberbichler/tap

      - name: brew audit
        if: steps.formulas.outputs.found == 'true'
        run: brew audit --strict --online --tap oberbichler/tap
